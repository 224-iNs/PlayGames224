<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ayo Bermain Sambil Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#FFF8F0;
    --sun:#FFDE9E;
    --grass:#B3E8B8;
    --berry:#FFA8BD;
    --sea:#8FDCE3;
    --grape:#C6ACEA;
    --peach:#FFC79B;
    --ink:#5B5468;
    --white:#FFFFFF;
    --shadow: 0 8px 0 rgba(91,84,104,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Fredoka', sans-serif;
    background: var(--sky);
    overflow:hidden;
    touch-action: manipulation;
  }
  #app{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* background scenery — soft hills, always visible, cheap to render */
  .hill{
    position:absolute; bottom:-6%; width:60%; height:38%;
    border-radius:50% 50% 0 0;
    z-index:0;
  }
  .hill.h1{ left:-10%; background: var(--grass); opacity:.55; }
  .hill.h2{ right:-15%; background: var(--sea); opacity:.35; }
  .sun-deco{
    position:absolute; top:4%; right:6%; width:70px; height:70px; border-radius:50%;
    background: var(--sun); box-shadow: 0 0 0 14px rgba(255,201,60,0.25);
    z-index:0;
  }

  .screen{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding: 4vh 4vw;
  }
  .screen.active{ display:flex; }

  /* ---------- MENU ---------- */
  #menu .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(2.2rem, 8vw, 4rem);
    color: var(--ink);
    margin: 0 0 .2em 0;
    text-align:center;
    letter-spacing: -0.02em;
  }
  #menu .title span{ color: var(--berry); }
  #menu .subtitle{
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--ink);
    opacity:.7;
    margin-bottom: 5vh;
    text-align:center;
  }
  .menu-grid{
    display:flex; gap: clamp(16px, 3vw, 28px);
    flex-wrap:wrap; justify-content:center; max-width: 900px;
  }
  .menu-card{
    width: clamp(150px, 28vw, 240px);
    height: clamp(170px, 30vw, 260px);
    border:none; border-radius: 32px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 10px;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    color: var(--white);
    box-shadow: var(--shadow);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .menu-card:active{ transform: translateY(6px); box-shadow: 0 2px 0 rgba(91,84,104,0.15); }
  .menu-card .emoji{ font-size: clamp(2.8rem, 8vw, 4rem); }
  .card-angka{ background: var(--berry); }
  .card-huruf{ background: var(--sea); }
  .card-warna{ background: var(--grape); }
  .card-tebak{ background: var(--peach); }
  .card-bentuk{ background: var(--grass); }

  /* ---------- GAME SCREENS SHARED ---------- */
  .topbar{
    position:absolute; top: max(16px, env(safe-area-inset-top)); left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: 0 4vw;
    z-index:5;
  }
  .topbar-left{
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .btn-speak{
    width:56px; height:56px; border-radius:50%; border:none;
    background: var(--berry); color: var(--white);
    font-size:1.4rem; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 5px 0 rgba(91,84,104,0.15);
    cursor:pointer;
  }
  .btn-speak:active{ transform: translateY(4px); box-shadow:none; }
  .btn-speak.speaking{ animation: speakPulse .55s ease-in-out infinite alternate; }
  .btn-back{
    width:56px; height:56px; border-radius:50%; border:none;
    background: var(--white); color: var(--ink);
    font-size:1.6rem; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 5px 0 rgba(91,84,104,0.15);
    cursor:pointer;
  }
  .btn-back:active{ transform: translateY(4px); box-shadow:none; }
  .stars-tray{
    display:flex; gap:6px; background: var(--white); padding: 10px 18px;
    border-radius: 999px; box-shadow: 0 5px 0 rgba(91,84,104,0.1);
    font-size: 1.3rem;
  }

  .prompt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    color: var(--ink);
    text-align:center;
    margin: 8vh 0 3vh 0;
    min-height: 2.4em;
    display:flex; align-items:center; justify-content:center;
    gap: .3em;
    flex-wrap:wrap;
    padding: 0 4vw;
  }
  .prompt .target-visual{ font-size: 1.4em; line-height:1; }

  .tiles-grid{
    display:grid;
    gap: clamp(10px, 2.2vw, 20px);
    width: min(94vw, 720px);
    justify-content:center;
  }
  .tiles-grid.grid-num{ grid-template-columns: repeat(5, 1fr); }
  .tiles-grid.grid-huruf{ grid-template-columns: repeat(6, 1fr); }
  .tiles-grid.grid-warna{ grid-template-columns: repeat(2, 1fr); width:min(90vw, 460px); }

  .tile{
    aspect-ratio: 1/1;
    border-radius: 22px; border:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size: clamp(1.1rem, 4vw, 1.8rem);
    color: var(--white);
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease, opacity .3s ease;
  }
  .tile:active{ transform: translateY(5px); box-shadow: 0 3px 0 rgba(91,84,104,0.15); }
  .tile.done{
    opacity:.35; pointer-events:none; transform:scale(.9);
  }
  .tile.wrong-shake{ animation: shake .35s ease; }
  @keyframes shake{
    20%{ transform: translateX(-8px) rotate(-3deg); }
    40%{ transform: translateX(8px) rotate(3deg); }
    60%{ transform: translateX(-6px) rotate(-2deg); }
    80%{ transform: translateX(6px) rotate(2deg); }
    100%{ transform: translateX(0); }
  }
  .tile.correct-pop{ animation: pop .4s ease; }
  @keyframes pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.25); }
    100%{ transform: scale(.9); }
  }

  .palette-0{ background: var(--berry); }
  .palette-1{ background: var(--sea); }
  .palette-2{ background: var(--sun); }
  .palette-3{ background: var(--grass); }
  .palette-4{ background: var(--grape); }
  .palette-5{ background: var(--peach); }

  .fruit-big{
    font-size: clamp(4.5rem, 18vw, 8rem);
    margin-bottom: 1vh;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-14px); }
  }

  .color-option{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
  }
  .color-swatch{ width: 46%; aspect-ratio:1/1; border-radius:50%; background: var(--white); box-shadow: inset 0 0 0 6px rgba(255,255,255,0.5); }
  .color-label{ font-size: clamp(1rem, 3.4vw, 1.4rem); }

  /* ---------- TEBAK BUAH (audio) ---------- */
  .guess-pill{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    background: var(--sun);
    color: var(--ink);
    padding: 16px 30px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    font-size: clamp(1.15rem, 4.2vw, 1.9rem);
    text-align:center;
    max-width: 92vw;
    margin: 2vh 0 3vh 0;
  }
  .replay-btn{
    width: 84px; height:84px; border-radius:50%;
    background: var(--berry); color:white; border:none;
    font-size: 2.1rem; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow); cursor:pointer;
    margin-bottom: 3.5vh;
  }
  .replay-btn:active{ transform: translateY(5px); box-shadow: 0 3px 0 rgba(91,84,104,0.15); }
  .replay-btn.speaking{ animation: speakPulse .55s ease-in-out infinite alternate; }
  @keyframes speakPulse{
    from{ transform: scale(1); box-shadow: var(--shadow); }
    to{ transform: scale(1.1); box-shadow: 0 8px 0 rgba(91,84,104,0.15), 0 0 0 10px rgba(255,111,145,0.25); }
  }
  .tiles-grid.grid-guess{ grid-template-columns: repeat(3, 1fr); width: min(92vw, 640px); }
  .guess-tile{
    background: var(--white);
    box-shadow: 0 8px 0 rgba(91,84,104,0.1);
    display:flex; align-items:center; justify-content:center;
  }
  .guess-emoji{ font-size: clamp(2.6rem, 11vw, 4.6rem); line-height:1; }
  .tile-text-lg{ font-size: clamp(2.2rem, 11vw, 4rem) !important; }
  .no-speech-note{
    font-size: .95rem; color: var(--ink); opacity:.55; margin-top: 2vh; text-align:center; max-width: 80vw;
  }

  /* ---------- TEBAK GAMBAR (bentuk) ---------- */
  .tiles-grid.grid-shape{ grid-template-columns: repeat(2, 1fr); width: min(84vw, 420px); }
  .shape-visual{ width:60%; height:60%; }
  .shape-circle{ border-radius:50%; }
  .shape-square{ width:58%; height:58%; border-radius:16%; }
  .shape-rect{ width:76%; height:44%; border-radius:12%; }
  .shape-triangle{ clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
  .shape-star{ clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .shape-heart{ clip-path: polygon(50% 15%, 61% 3%, 75% 0%, 89% 3%, 97% 15%, 100% 30%, 96% 45%, 90% 58%, 80% 70%, 50% 95%, 20% 70%, 10% 58%, 4% 45%, 0% 30%, 3% 15%, 11% 3%, 25% 0%, 39% 3%); }

  /* ---------- CELEBRATION ---------- */
  #celebrate{
    background: rgba(255,244,224,0.97);
  }
  .celebrate-emoji{
    font-size: clamp(5rem, 20vw, 8rem);
    animation: bounce .6s ease infinite alternate;
  }
  @keyframes bounce{
    from{ transform: translateY(0) rotate(-4deg); }
    to{ transform: translateY(-24px) rotate(4deg); }
  }
  .celebrate-text{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size: clamp(1.8rem, 7vw, 3rem);
    color: var(--berry);
    margin: 2vh 0;
    text-align:center;
  }
  .btn-again{
    margin-top: 3vh;
    padding: 18px 44px;
    border:none; border-radius: 999px;
    background: var(--grass); color:white;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .btn-again:active{ transform: translateY(6px); box-shadow:none; }

  .confetti{
    position:absolute; top:-10%; border-radius:3px;
    animation: fall linear forwards;
    z-index: 10;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(360deg); opacity:.9; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <div class="sun-deco"></div>

  <!-- MENU -->
  <section id="menu" class="screen active">
    <h1 class="title">Ayo <span>Belajar!</span> 🎈</h1>
    <p class="subtitle">Pilih permainan yang mau dimainkan</p>
    <div class="menu-grid">
      <button class="menu-card card-angka" data-go="angka">
        <span class="emoji">🔢</span>
        <span>Angka</span>
      </button>
      <button class="menu-card card-huruf" data-go="huruf">
        <span class="emoji">🔤</span>
        <span>Huruf</span>
      </button>
      <button class="menu-card card-warna" data-go="warna">
        <span class="emoji">🍎</span>
        <span>Warna Buah</span>
      </button>
      <button class="menu-card card-bentuk" data-go="bentuk">
        <span class="emoji">🔺</span>
        <span>Tebak Gambar</span>
      </button>
      <button class="menu-card card-tebak" data-go="tebak">
        <span class="emoji">🔊</span>
        <span>Dengar &amp; Tebak</span>
      </button>
    </div>
  </section>

  <!-- ANGKA & HURUF GAME (shared layout) -->
  <section id="sequence" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-back" data-go="menu">←</button>
        <button class="btn-speak" id="seqSpeakBtn" aria-label="Dengar lagi">🔊</button>
      </div>
      <div class="stars-tray" id="seqStars">⭐</div>
    </div>
    <div class="prompt" id="seqPrompt">Cari angka <span class="target-visual" id="seqTarget">1</span></div>
    <div class="tiles-grid" id="seqGrid"></div>
  </section>

  <!-- WARNA BUAH GAME -->
  <section id="colorgame" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-back" data-go="menu">←</button>
        <button class="btn-speak" id="colorSpeakBtn" aria-label="Dengar lagi">🔊</button>
      </div>
      <div class="stars-tray" id="colorStars">⭐</div>
    </div>
    <div class="fruit-big" id="fruitEmoji">🍌</div>
    <div class="prompt" id="colorPrompt">Ini warnanya apa?</div>
    <div class="tiles-grid grid-warna" id="colorGrid"></div>
  </section>

  <!-- TEBAK GAMBAR (BENTUK) -->
  <section id="shapegame" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-back" data-go="menu">←</button>
        <button class="btn-speak" id="shapeSpeakBtn" aria-label="Dengar lagi">🔊</button>
      </div>
      <div class="stars-tray" id="shapeStars">⭐</div>
    </div>
    <div class="guess-pill" id="shapePrompt">Yang mana gambar lingkaran?</div>
    <div class="tiles-grid grid-shape" id="shapeGrid"></div>
  </section>

  <!-- TEBAK BUAH DARI SUARA -->
  <section id="guessgame" class="screen">
    <div class="topbar">
      <button class="btn-back" data-go="menu">←</button>
      <div class="stars-tray" id="guessStars">⭐</div>
    </div>
    <div class="guess-pill" id="guessPrompt">Sentuh speaker untuk mulai!</div>
    <button class="replay-btn" id="guessReplayBtn" aria-label="Dengar lagi">🔊</button>
    <div class="tiles-grid grid-guess" id="guessGrid"></div>
    <div class="no-speech-note" id="noSpeechNote" style="display:none;">Perangkat ini belum mendukung suara. Bacakan pertanyaan di atas untuk anak ya!</div>
  </section>

  <!-- CELEBRATION -->
  <section id="celebrate" class="screen">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-text">Hebat! Kamu Berhasil!</div>
    <button class="btn-again" id="playAgainBtn">Main Lagi</button>
  </section>
</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');
  var screens = document.querySelectorAll('.screen');
  var currentMode = null; // 'angka' | 'huruf' | 'warna'

  function showScreen(id){
    screens.forEach(function(s){ s.classList.toggle('active', s.id === id); });
  }

  // ---- simple friendly beep sounds via WebAudio (no external files) ----
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  function ctx(){ if(!actx){ actx = new AudioCtx(); } return actx; }
  function beep(freq, dur, type, delay){
    try{
      var c = ctx();
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = 0.001;
      o.connect(g); g.connect(c.destination);
      var t0 = c.currentTime + (delay || 0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    }catch(e){ /* audio not available, ignore */ }
  }
  function playCorrect(){ beep(523.25, 0.14, 'sine', 0); beep(783.99, 0.18, 'sine', 0.1); }
  function playWrong(){ beep(220, 0.18, 'sine', 0); }
  function playWin(){ beep(523.25,0.12,'sine',0); beep(659.25,0.12,'sine',0.12); beep(783.99,0.12,'sine',0.24); beep(1046.5,0.22,'sine',0.36); }

  // ---- speech (text-to-speech) for "Dengar & Tebak" game ----
  var speechSupported = ('speechSynthesis' in window);
  var idVoice = null;
  function pickIndonesianVoice(){
    if(!speechSupported) return;
    var voices = window.speechSynthesis.getVoices();
    var idVoices = [];
    for(var i = 0; i < voices.length; i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf('id') === 0){
        idVoices.push(voices[i]);
      }
    }
    if(idVoices.length === 0) return;
    // prefer a higher-quality engine voice (e.g. Google) when available, for a fresher, less robotic sound
    var chosen = idVoices[0];
    for(var j = 0; j < idVoices.length; j++){
      if(/google|natural|wavenet/i.test(idVoices[j].name)){ chosen = idVoices[j]; break; }
    }
    idVoice = chosen;
  }
  if(speechSupported){
    pickIndonesianVoice();
    window.speechSynthesis.onvoiceschanged = pickIndonesianVoice;
  }
  function speak(text, onStart, onEnd){
    if(!speechSupported){ if(onEnd) onEnd(); return; }
    try{
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      if(idVoice) utter.voice = idVoice;
      // slight randomization each time keeps the voice from sounding flat/repetitive
      // natural, gentle children's voice — clear and warm, not exaggerated or shrill
      utter.rate = 0.86 + Math.random() * 0.06;
      utter.pitch = 1.12 + Math.random() * 0.1;
      utter.onstart = function(){ if(onStart) onStart(); };
      utter.onend = function(){ if(onEnd) onEnd(); };
      utter.onerror = function(){ if(onEnd) onEnd(); };
      window.speechSynthesis.speak(utter);
    }catch(e){ if(onEnd) onEnd(); }
  }

  // cheerful praise cheers spoken after every correct answer, across all games
  var praisePhrases = ['Hebat!', 'Betul sekali!', 'Pintar!', 'Wah, bagus!', 'Iya, benar!', 'Pintar sekali!'];
  function speakPraise(onDone){
    var phrase = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
    var minDelay = 450;
    var start = Date.now();
    speak(phrase, null, function(){
      var wait = Math.max(0, minDelay - (Date.now() - start));
      setTimeout(function(){ if(onDone) onDone(); }, wait);
    });
  }

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function confettiBurst(){
    var colors = ['#FFA8BD','#FFDE9E','#B3E8B8','#8FDCE3','#C6ACEA','#FFC79B'];
    for(var i = 0; i < 40; i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      var size = 6 + Math.random() * 8;
      el.style.width = size + 'px';
      el.style.height = (size * 1.4) + 'px';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
      el.style.animationDelay = (Math.random() * 0.4) + 's';
      app.appendChild(el);
      (function(node){
        setTimeout(function(){ node.remove(); }, 3600);
      })(el);
    }
  }

  function celebrate(){
    playWin();
    showScreen('celebrate');
    confettiBurst();
  }

  // ---------------- SEQUENCE GAME (Angka & Huruf) ----------------
  var seq = {
    items: [],      // full ordered list e.g. [1..20] or ['A'..'Z']
    index: 0,       // which target we're looking for
    mode: null
  };

  function buildNumberItems(){
    var arr = [];
    for(var i = 1; i <= 20; i++){ arr.push(String(i)); }
    return arr;
  }
  function buildLetterItems(){
    var arr = [];
    for(var i = 0; i < 26; i++){ arr.push(String.fromCharCode(65 + i)); }
    return arr;
  }

  function startSequence(mode){
    currentMode = mode;
    seq.mode = mode;
    seq.items = mode === 'angka' ? buildNumberItems() : buildLetterItems();
    seq.index = 0;
    document.getElementById('seqGrid').className = 'tiles-grid ' + (mode === 'angka' ? 'grid-num' : 'grid-huruf');
    renderSeqBoard();
    updateSeqPrompt();
    updateSeqStars();
    showScreen('sequence');
  }

  function renderSeqBoard(){
    var grid = document.getElementById('seqGrid');
    grid.innerHTML = '';
    var shuffled = seq.items.slice();
    shuffle(shuffled);
    shuffled.forEach(function(val, i){
      var btn = document.createElement('button');
      btn.className = 'tile palette-' + (i % 6);
      btn.textContent = val;
      btn.dataset.value = val;
      btn.addEventListener('click', function(){ onSeqTileClick(btn, val); });
      grid.appendChild(btn);
    });
  }

  function updateSeqPrompt(){
    var label = seq.mode === 'angka' ? 'angka' : 'huruf';
    document.getElementById('seqPrompt').innerHTML =
      'Cari ' + label + ' <span class="target-visual" id="seqTarget">' + seq.items[seq.index] + '</span>';
    setTimeout(speakSeqPrompt, 300);
  }

  function speakSeqPrompt(){
    var label = seq.mode === 'angka' ? 'angka' : 'huruf';
    var btn = document.getElementById('seqSpeakBtn');
    var pep = ['Ayo cari ', 'Yuk cari ', 'Coba cari '][Math.floor(Math.random() * 3)];
    speak(pep + label + ' ' + seq.items[seq.index] + '!',
      function(){ btn.classList.add('speaking'); },
      function(){ btn.classList.remove('speaking'); }
    );
  }

  function updateSeqStars(){
    var earned = seq.index;
    var s = '';
    for(var i = 0; i < Math.min(earned,5); i++){ s += '⭐'; }
    document.getElementById('seqStars').textContent = (earned) + ' ⭐';
  }

  function onSeqTileClick(btn, val){
    if(btn.classList.contains('done')) return;
    var target = seq.items[seq.index];
    if(val === target){
      playCorrect();
      btn.classList.add('correct-pop');
      setTimeout(function(){ btn.classList.add('done'); }, 150);
      seq.index++;
      updateSeqStars();
      if(seq.index >= seq.items.length){
        setTimeout(celebrate, 500);
      } else {
        speakPraise(function(){ updateSeqPrompt(); });
      }
    } else {
      playWrong();
      btn.classList.remove('wrong-shake');
      void btn.offsetWidth; // restart animation
      btn.classList.add('wrong-shake');
    }
  }

  document.getElementById('seqSpeakBtn').addEventListener('click', function(){
    speakSeqPrompt();
  });

  // ---------------- WARNA BUAH GAME ----------------
  var fruits = [
    { emoji:'🍌', name:'Pisang', color:'Kuning', swatch:'#FFE18C' },
    { emoji:'🍎', name:'Apel', color:'Merah', swatch:'#FFA3A3' },
    { emoji:'🍊', name:'Jeruk', color:'Oranye', swatch:'#FFC79B' },
    { emoji:'🍇', name:'Anggur', color:'Ungu', swatch:'#C6ACEA' },
    { emoji:'🍉', name:'Semangka', color:'Merah', swatch:'#FFA3A3' },
    { emoji:'🥝', name:'Kiwi', color:'Hijau', swatch:'#B3E8B8' },
    { emoji:'🫐', name:'Blueberry', color:'Biru', swatch:'#9DCBF0' },
    { emoji:'🍋', name:'Lemon', color:'Kuning', swatch:'#FFE18C' },
    { emoji:'🍑', name:'Persik', color:'Oranye', swatch:'#FFC79B' }
  ];
  var allColors = [
    { name:'Merah', swatch:'#FFA3A3' },
    { name:'Kuning', swatch:'#FFE18C' },
    { name:'Hijau', swatch:'#B3E8B8' },
    { name:'Biru', swatch:'#9DCBF0' },
    { name:'Oranye', swatch:'#FFC79B' },
    { name:'Ungu', swatch:'#C6ACEA' }
  ];

  var colorGame = {
    round: 0,
    totalRounds: 8,
    current: null
  };

  function startColorGame(){
    currentMode = 'warna';
    colorGame.round = 0;
    nextColorRound();
    updateColorStars();
    showScreen('colorgame');
  }

  function nextColorRound(){
    if(colorGame.round >= colorGame.totalRounds){
      setTimeout(celebrate, 400);
      return;
    }
    var fruit = fruits[Math.floor(Math.random() * fruits.length)];
    colorGame.current = fruit;
    document.getElementById('fruitEmoji').textContent = fruit.emoji;
    document.getElementById('colorPrompt').textContent = fruit.name + ' ini warnanya apa?';
    setTimeout(speakColorPrompt, 300);

    var options = [fruit];
    var pool = allColors.filter(function(c){ return c.name !== fruit.color; });
    shuffle(pool);
    var seen = { };
    seen[fruit.color] = true;
    var i = 0;
    while(options.length < 4 && i < pool.length){
      var c = pool[i++];
      if(!seen[c.name]){
        seen[c.name] = true;
        options.push({ color: c.name, swatch: c.swatch });
      }
    }
    shuffle(options);

    var grid = document.getElementById('colorGrid');
    grid.innerHTML = '';
    options.forEach(function(opt, idx){
      var btn = document.createElement('button');
      btn.className = 'tile palette-' + (idx % 6);
      btn.style.background = 'transparent';
      btn.style.boxShadow = 'none';
      var wrap = document.createElement('div');
      wrap.className = 'color-option';
      var swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.background = opt.swatch;
      var label = document.createElement('div');
      label.className = 'color-label';
      label.textContent = opt.color;
      label.style.color = 'var(--ink)';
      wrap.appendChild(swatch);
      wrap.appendChild(label);
      btn.appendChild(wrap);
      btn.style.background = '#FFFFFF';
      btn.style.boxShadow = '0 8px 0 rgba(91,84,104,0.12)';
      btn.addEventListener('click', function(){ onColorPick(btn, opt.color); });
      grid.appendChild(btn);
    });
  }

  function updateColorStars(){
    document.getElementById('colorStars').textContent = colorGame.round + ' ⭐';
  }

  function speakColorPrompt(){
    if(!colorGame.current) return;
    var btn = document.getElementById('colorSpeakBtn');
    speak(colorGame.current.name + ' ini warnanya apa ya?',
      function(){ btn.classList.add('speaking'); },
      function(){ btn.classList.remove('speaking'); }
    );
  }

  document.getElementById('colorSpeakBtn').addEventListener('click', function(){
    speakColorPrompt();
  });

  function onColorPick(btn, pickedColor){
    var correct = colorGame.current.color;
    if(pickedColor === correct){
      playCorrect();
      btn.classList.add('correct-pop');
      colorGame.round++;
      updateColorStars();
      speakPraise(function(){ nextColorRound(); });
    } else {
      playWrong();
      btn.classList.remove('wrong-shake');
      void btn.offsetWidth;
      btn.classList.add('wrong-shake');
    }
  }

  // ---------------- TEBAK GAMBAR (bentuk) ----------------
  var shapes = [
    { key:'lingkaran', name:'Lingkaran', cls:'shape-circle' },
    { key:'persegi', name:'Persegi', cls:'shape-square' },
    { key:'persegi-panjang', name:'Persegi Panjang', cls:'shape-rect' },
    { key:'segitiga', name:'Segitiga', cls:'shape-triangle' },
    { key:'bintang', name:'Bintang', cls:'shape-star' },
    { key:'hati', name:'Hati', cls:'shape-heart' }
  ];
  var shapePalette = ['var(--berry)','var(--sea)','var(--sun)','var(--grass)','var(--grape)','var(--peach)'];

  var shapeGame = { round: 0, totalRounds: 8, current: null, options: [] };

  function startShapeGame(){
    currentMode = 'bentuk';
    shapeGame.round = 0;
    updateShapeStars();
    nextShapeRound();
    showScreen('shapegame');
  }

  function nextShapeRound(){
    if(shapeGame.round >= shapeGame.totalRounds){
      setTimeout(celebrate, 400);
      return;
    }
    var pool = shapes.slice();
    shuffle(pool);
    var options = pool.slice(0, 4);
    var target = options[Math.floor(Math.random() * options.length)];
    shapeGame.current = target;
    shuffle(options);
    shapeGame.options = options;

    document.getElementById('shapePrompt').textContent = 'Yang mana gambar ' + target.name + '?';
    renderShapeOptions();
    setTimeout(speakShapePrompt, 300);
  }

  function speakShapePrompt(){
    if(!shapeGame.current) return;
    var btn = document.getElementById('shapeSpeakBtn');
    speak('Yang mana gambar ' + shapeGame.current.name + '?',
      function(){ btn.classList.add('speaking'); },
      function(){ btn.classList.remove('speaking'); }
    );
  }

  function renderShapeOptions(){
    var grid = document.getElementById('shapeGrid');
    grid.innerHTML = '';
    shapeGame.options.forEach(function(shape, idx){
      var btn = document.createElement('button');
      btn.className = 'tile guess-tile';
      var shapeEl = document.createElement('div');
      shapeEl.className = 'shape-visual ' + shape.cls;
      shapeEl.style.background = shapePalette[idx % shapePalette.length];
      btn.appendChild(shapeEl);
      btn.addEventListener('click', function(){ onShapePick(btn, shape); });
      grid.appendChild(btn);
    });
  }

  function onShapePick(btn, shape){
    if(btn.classList.contains('done')) return;
    if(shape.key === shapeGame.current.key){
      playCorrect();
      btn.classList.add('correct-pop', 'done');
      shapeGame.round++;
      updateShapeStars();
      speakPraise(function(){ nextShapeRound(); });
    } else {
      playWrong();
      btn.classList.remove('wrong-shake');
      void btn.offsetWidth;
      btn.classList.add('wrong-shake');
    }
  }

  function updateShapeStars(){
    document.getElementById('shapeStars').textContent = shapeGame.round + ' ⭐';
  }

  document.getElementById('shapeSpeakBtn').addEventListener('click', function(){
    speakShapePrompt();
  });

  // ---------------- DENGAR & TEBAK (audio, kategori acak) ----------------
  var animals = [
    { emoji:'🐱', name:'Kucing' },
    { emoji:'🐶', name:'Anjing' },
    { emoji:'🐮', name:'Sapi' },
    { emoji:'🐔', name:'Ayam' },
    { emoji:'🦆', name:'Bebek' },
    { emoji:'🐰', name:'Kelinci' },
    { emoji:'🐘', name:'Gajah' },
    { emoji:'🦁', name:'Singa' },
    { emoji:'🐟', name:'Ikan' },
    { emoji:'🐸', name:'Katak' },
    { emoji:'🦋', name:'Kupu-kupu' },
    { emoji:'🐐', name:'Kambing' },
    { emoji:'🐦', name:'Burung' },
    { emoji:'🐴', name:'Kuda' }
  ];
  var guessNumberItems = (function(){
    var arr = [];
    for(var i = 1; i <= 20; i++){ arr.push({ emoji:String(i), name:String(i) }); }
    return arr;
  })();
  var guessLetterItems = (function(){
    var arr = [];
    for(var i = 0; i < 26; i++){ var ch = String.fromCharCode(65 + i); arr.push({ emoji:ch, name:ch }); }
    return arr;
  })();
  var guessCategories = [
    { key:'buah',  word:'buah',  items: fruits,           render:'emoji' },
    { key:'hewan', word:'hewan', items: animals,          render:'emoji' },
    { key:'angka', word:'angka', items: guessNumberItems, render:'tile' },
    { key:'huruf', word:'huruf', items: guessLetterItems, render:'tile' }
  ];
  var promptTemplates = [
    'Yang mana {word} {name}?',
    'Coba cari {word} {name}?',
    'Ayo tunjukkan {word} {name}?',
    'Dimana {word} {name} ya?',
    'Yuk, sentuh {word} {name}!',
    'Hayo, mana {word} {name}?'
  ];

  var guessGame = { round: 0, totalRounds: 8, current: null, options: [], categoryRender: 'emoji', promptText: '' };

  function startGuessGame(){
    currentMode = 'tebak';
    guessGame.round = 0;
    document.getElementById('noSpeechNote').style.display = speechSupported ? 'none' : 'block';
    updateGuessStars();
    nextGuessRound();
    showScreen('guessgame');
  }

  function nextGuessRound(){
    if(guessGame.round >= guessGame.totalRounds){
      setTimeout(celebrate, 400);
      return;
    }
    var cat = guessCategories[Math.floor(Math.random() * guessCategories.length)];
    var pool = cat.items.slice();
    shuffle(pool);
    var chosen = [];
    var usedNames = {};
    for(var i = 0; i < pool.length && chosen.length < 3; i++){
      if(!usedNames[pool[i].name]){
        usedNames[pool[i].name] = true;
        chosen.push(pool[i]);
      }
    }
    var target = chosen[Math.floor(Math.random() * chosen.length)];
    guessGame.current = target;
    guessGame.categoryRender = cat.render;
    shuffle(chosen);
    guessGame.options = chosen;

    var template = promptTemplates[Math.floor(Math.random() * promptTemplates.length)];
    var text = template.replace('{word}', cat.word).replace('{name}', target.name);
    text = text.charAt(0).toUpperCase() + text.slice(1);
    guessGame.promptText = text;

    document.getElementById('guessPrompt').textContent = text;
    renderGuessOptions();
    askGuessQuestion();
  }

  function askGuessQuestion(){
    var btn = document.getElementById('guessReplayBtn');
    speak(guessGame.promptText,
      function(){ btn.classList.add('speaking'); },
      function(){ btn.classList.remove('speaking'); }
    );
  }

  function renderGuessOptions(){
    var grid = document.getElementById('guessGrid');
    grid.innerHTML = '';
    guessGame.options.forEach(function(item, idx){
      var btn = document.createElement('button');
      if(guessGame.categoryRender === 'tile'){
        btn.className = 'tile tile-text-lg palette-' + (idx % 6);
        btn.textContent = item.emoji;
      } else {
        btn.className = 'tile guess-tile';
        var em = document.createElement('div');
        em.className = 'guess-emoji';
        em.textContent = item.emoji;
        btn.appendChild(em);
      }
      btn.addEventListener('click', function(){ onGuessPick(btn, item); });
      grid.appendChild(btn);
    });
  }

  function onGuessPick(btn, item){
    if(btn.classList.contains('done')) return;
    if(item.name === guessGame.current.name){
      playCorrect();
      btn.classList.add('correct-pop', 'done');
      guessGame.round++;
      updateGuessStars();
      speakPraise(function(){ nextGuessRound(); });
    } else {
      playWrong();
      btn.classList.remove('wrong-shake');
      void btn.offsetWidth;
      btn.classList.add('wrong-shake');
    }
  }

  function updateGuessStars(){
    document.getElementById('guessStars').textContent = guessGame.round + ' ⭐';
  }

  document.getElementById('guessReplayBtn').addEventListener('click', function(){
    if(guessGame.current) askGuessQuestion();
  });

  // ---------------- NAVIGATION ----------------
  document.addEventListener('click', function(e){
    var goEl = e.target.closest('[data-go]');
    if(!goEl) return;
    var dest = goEl.dataset.go;
    if(dest === 'menu'){
      if(speechSupported){ window.speechSynthesis.cancel(); }
      showScreen('menu');
      return;
    }
    if(dest === 'angka' || dest === 'huruf'){ startSequence(dest); return; }
    if(dest === 'warna'){ startColorGame(); return; }
    if(dest === 'bentuk'){ startShapeGame(); return; }
    if(dest === 'tebak'){ startGuessGame(); return; }
  });

  document.getElementById('playAgainBtn').addEventListener('click', function(){
    if(currentMode === 'angka' || currentMode === 'huruf'){
      startSequence(currentMode);
    } else if(currentMode === 'warna'){
      startColorGame();
    } else if(currentMode === 'bentuk'){
      startShapeGame();
    } else if(currentMode === 'tebak'){
      startGuessGame();
    } else {
      showScreen('menu');
    }
  });

})();
</script>
</body>
</html>
